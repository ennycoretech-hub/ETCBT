  <script>
    // ============================================================
    // SecureTimer — tamper-resistant countdown.
    // Keeps its own private state behind a closure; the only way in
    // or out is start()/getTime(). Mirrors the deadline into
    // localStorage("st") and the hidden #ts input so a page reload,
    // a clock hack, or a devtools variable edit can be caught by
    // comparing the two independent copies.
    // ============================================================
    const SecureTimer = (function () {
      let st = null; // session token / start marker
      let dur = 0; // total duration in ms
      let deadline = 0; // absolute end time (ms since epoch)
      let iv = null; // interval handle
      let paused = false;
      let tsInput = null;

      function persist() {
        try {
          localStorage.setItem('st', String(deadline));
        } catch (e) {
          /* storage unavailable — degrade silently */
        }
        tsInput = tsInput || document.getElementById('ts');
        if (tsInput) tsInput.value = String(deadline);
      }

      function readBoth() {
        let lsVal = null;
        try {
          lsVal = localStorage.getItem('st');
        } catch (e) {}
        tsInput = tsInput || document.getElementById('ts');
        const inputVal = tsInput ? tsInput.value: null;
        return {
          lsVal,
          inputVal
        };
      }

      function checkTamper() {
        const {
          lsVal,
          inputVal
        } = readBoth();
        if (lsVal == null || inputVal == null || lsVal === '' || inputVal === '') return false;
        return String(lsVal) !== String(inputVal);
      }

      function tick() {
        if (paused) return;
        if (checkTamper()) {
          AntiCheat._logViolation('Timer mismatch detected');
          // Trust the earlier (smaller) deadline so tampering can only
          // shorten, never extend, the remaining time.
          const {
            lsVal,
            inputVal
          } = readBoth();
          deadline = Math.min(Number(lsVal) || deadline, Number(inputVal) || deadline);
          persist();
        }
        const remaining = deadline - Date.now();
        if (remaining <= 0) {
          clearInterval(iv);
          iv = null;
          document.dispatchEvent(new CustomEvent('securetimer:end'));
          return;
        }
        document.dispatchEvent(new CustomEvent('securetimer:tick', {
          detail: {
            remaining
          }
        }));
      }

      function start(ms) {
        dur = ms;
        deadline = Date.now() + ms;
        persist();
        if (iv) clearInterval(iv);
        iv = setInterval(tick, 1000);
        window.addEventListener('blur', () => {
          paused = true;
        });
        window.addEventListener('focus', () => {
          paused = false;
        });
      }

      function getTime() {
        return Math.max(0, deadline - Date.now());
      }

      return {
        start: start,
        getTime: getTime
      };
    })();
    Object.freeze(SecureTimer);

    // ============================================================
    // AntiCheat — locks down the exam surface and watches for
    // tampering signals. Violations are logged to window.clog and
    // surfaced through the #cb banner + UI.toast (never alert()).
    // ============================================================
    const AntiCheat = (function () {
      let warningCount = 0;
      let devtoolsOpen = false;
      let inactivityTimer = null;
      const INACTIVITY_LIMIT_MS = 60000;
      const DEVTOOLS_THRESHOLD = 160;

      window.clog = window.clog || [];

      function _logViolation(reason) {
        const entry = {
          reason: reason,
          at: new Date().toISOString()
        };
        window.clog.push(entry);
        renderBanner(reason);
      }
      

      function renderBanner(msg) {
        const cb = document.getElementById('cb');
        if (!cb) return;
        cb.textContent = '⚠ ' + msg;
        cb.classList.add('cb-show');
        clearTimeout(renderBanner._t);
        renderBanner._t = setTimeout(() => cb.classList.remove('cb-show'), 4000);
      }

      function warn(msg) {
        if (window.UI) UI.toast(msg, 'warning');
        renderBanner(msg);
      }

      function terminateExam(reason) {
        _logViolation('TERMINATED: ' + reason);
        if (typeof tim !== 'undefined') clearInterval(tim);
        try {
          localStorage.setItem('score', 0);
        } catch (e) {}
        if (typeof scd !== 'undefined' && scd) scd.value = 0;
        if (window.UI) {
          UI.modal('Exam Terminated', 'This session was ended: ' + reason, function () {
            if (typeof sbt === 'function') sbt();
          });
        } else if (typeof sbt === 'function') {
          sbt();
        }
      }

      function resetInactivity() {
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
          _logViolation('Inactivity for 60s');
          warn('No activity detected — please continue your exam');
        }, INACTIVITY_LIMIT_MS);
      }

      function init() {
        // Block right-click
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          _logViolation('Right-click blocked');
        });

        // Block copy / paste / cut
        document.addEventListener('copy', function (e) {
          e.preventDefault();
          _logViolation('Copy blocked');
        });
        document.addEventListener('paste', function (e) {
          e.preventDefault();
          _logViolation('Paste blocked');
        });
        document.addEventListener('cut', function (e) {
          e.preventDefault();
          _logViolation('Cut blocked');
        });

        // Block text selection / drag
        document.addEventListener('selectstart', function (e) {
          e.preventDefault();
        });
        document.addEventListener('dragstart', function (e) {
          e.preventDefault();
        });

        // Block devtools / view-source key combos
        document.addEventListener('keydown', function (e) {
          if (e.keyCode === 123) {
            // F12
            e.preventDefault();
            warn('Developer tools disabled during exam');
            return false;
          }
          if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
            e.preventDefault();
            warn('Developer tools disabled during exam');
            return false;
          }
          if (e.ctrlKey && e.keyCode === 85) {
            // Ctrl+U
            e.preventDefault();
            warn('View source disabled');
            return false;
          }
          if (e.keyCode === 122) {
            // F11
            e.preventDefault();
            warn('Fullscreen disabled during exam');
            return false;
          }
          if (e.ctrlKey && e.shiftKey && e.keyCode === 75) {
            // Firefox console
            e.preventDefault();
            return false;
          }
        });

        // Devtools-open heuristic via viewport delta
        setInterval(function () {
          const widthDiff = window.outerWidth - window.innerWidth;
          const heightDiff = window.outerHeight - window.innerHeight;
          if (widthDiff > DEVTOOLS_THRESHOLD || heightDiff > DEVTOOLS_THRESHOLD) {
            if (!devtoolsOpen) {
              devtoolsOpen = true;
              terminateExam('DevTools detected');
            }
          } else {
            devtoolsOpen = false;
          }
        },
          500);


        // NOTE: intentionally not terminating on resize — a maximised
        // browser window is indistinguishable from "fullscreen" here,
        // and would wrongly fail honest candidates. DevTools-open and
        // tab-switch checks above already cover the real threats.

        // Tab switch / blur detection
        document.addEventListener('visibilitychange',
          function () {
            if (document.hidden && typeof main !== 'undefined' && main && main.style.display !== 'none') {
              warningCount++;
              _logViolation('Tab switch #' + warningCount);
              if (warningCount >= 2) {
                terminateExam('Tab switching detected');
              } else {
                warn('Warning ' + warningCount + '/2: Do not leave the exam window');
              }
            }
          });

        // Inactivity detection (60s)
        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (evt) {
          document.addEventListener(evt, resetInactivity, {
            passive: true
          });
        });
        resetInactivity();
      }

      return {
        init: init, _logViolation: _logViolation
      };
    })();
